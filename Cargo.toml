[workspace]
resolver = "2"
members = [
  "apps/gateway",
  "crates/tmex-db",
  "crates/tmex-protocol",
  "crates/tmex-terminal",
]

[workspace.package]
version = "0.17.0"
edition = "2021"
rust-version = "1.90.0"
license = "MIT"
publish = false

[workspace.dependencies]
tmex-db = { path = "crates/tmex-db" }
tmex-protocol = { path = "crates/tmex-protocol" }
tmex-terminal = { path = "crates/tmex-terminal" }

alacritty_terminal = "=0.26.0"
aes-gcm = "=0.10.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"
borsh = { version = "1.7", features = ["derive"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "=0.3.34"
hex = "0.4"
hmac = "=0.12.1"
http = "1"
http-body-util = "0.1"
icu_collator = "=2.2.1"
icu_locale = "=2.2.0"
percent-encoding = "=2.3.2"
rand = "0.8"
regex = "=1.13.1"
regress = { version = "=0.11.1", features = ["utf16"] }
reqwest = { version = "=0.12.26", default-features = false, features = ["rustls-tls"] }
sea-orm = { version = "=1.1.16", default-features = false, features = ["macros", "proxy", "with-chrono", "with-json", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "=3.27.0"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
turso = { version = "=0.7.2", default-features = false }
uuid = { version = "1", features = ["serde", "v4"] }
